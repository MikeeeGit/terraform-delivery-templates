# PRIVATE deployment repository only. This tests identity, not plan/apply.
name: Azure OIDC preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    environment: azure-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate through the protected environment
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Confirm selected subscription
        env:
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          actual=$(az account show --query id --output tsv)
          test "$actual" = "$EXPECTED_SUBSCRIPTION"
          echo "Azure identity is authenticated to the expected subscription."

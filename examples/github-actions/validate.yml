# Copy to .github/workflows/terraform.yml in a consuming GitHub repository.
# Use the reviewed v0.2.0 commit in TERRAFORM_DELIVERY_SHA; keep the workflow release aligned.
name: Terraform validation
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@v0.2.0
    with:
      template-ref: ${{ vars.TERRAFORM_DELIVERY_SHA }}
      directory: .
      # Opt in only when these tests are mocked/credential-free:
      # test-directory: tests/unit

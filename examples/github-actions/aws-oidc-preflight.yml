# PRIVATE deployment repository only. This tests identity, not plan/apply.
name: AWS OIDC preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    environment: aws-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the environment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: terraform-preflight
      - name: Confirm identity
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "$EXPECTED_ACCOUNT"
          echo "AWS identity is authenticated to the expected account."

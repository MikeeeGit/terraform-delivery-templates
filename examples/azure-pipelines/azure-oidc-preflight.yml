# Copy only into a PRIVATE Azure DevOps project. Configure environment approval
# and service-connection branch checks in the UI before running this starter.
trigger: none
pr: none
stages:
  - stage: IdentityPreflight
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - deployment: AzureIdentity
        environment: azure-sandbox
        pool:
          vmImage: ubuntu-24.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: none
                - task: AzureCLI@2
                  displayName: Test Azure workload federation
                  inputs:
                    azureSubscription: azure-sandbox-oidc
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az account show --query id --output none
                      echo "Azure identity preflight succeeded."

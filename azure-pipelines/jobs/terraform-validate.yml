# Caller must declare the pinned deliveryTemplates repository resource.
parameters:
  - name: jobName
    type: string
    default: TerraformValidation
  - name: directory
    type: string
    default: .
  - name: testDirectory
    type: string
    default: ''
  - name: varFiles
    type: string
    default: ''

jobs:
  - job: ${{ parameters.jobName }}
    displayName: Credential-free Terraform validation
    timeoutInMinutes: 15
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        path: s/source
        persistCredentials: false
        fetchDepth: 1
      - checkout: deliveryTemplates
        path: s/delivery-templates
        persistCredentials: false
        fetchDepth: 1
      - bash: |
          set -euo pipefail
          python3 "$PIPELINE_WORKSPACE/s/delivery-templates/scripts/install_terraform.py"             --install-dir "$AGENT_TEMPDIRECTORY/terraform-bin"
          echo "##vso[task.prependpath]$AGENT_TEMPDIRECTORY/terraform-bin"
        displayName: Install checksum-verified Terraform 1.16.3
      - bash: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          workspace = Path(os.environ["PIPELINE_WORKSPACE"]) / "s"
          command = [sys.executable, str(workspace / "delivery-templates/scripts/validate.py"),
                     "--source-root", str(workspace / "source"),
                     "--directory", os.environ["TERRAFORM_DIRECTORY"],
                     "--test-directory", os.environ["TEST_DIRECTORY"]]
          command.extend(f"--var-file={line}" for line in os.environ["VAR_FILES"].splitlines() if line.strip())
          subprocess.run(command, check=True)
          PYTHON
        displayName: Validate configuration
        env:
          TERRAFORM_DIRECTORY: ${{ parameters.directory }}
          TEST_DIRECTORY: ${{ parameters.testDirectory }}
          VAR_FILES: ${{ parameters.varFiles }}

# Self-tests only. No cloud login, deployment or service connection is used.
# Azure Repos PR validation is configured as a branch policy.
trigger:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
pr:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
pool:
  vmImage: ubuntu-24.04
steps:
  - checkout: self
    persistCredentials: false
  - bash: |
      set -euo pipefail
      python3 scripts/install_terraform.py --install-dir "$AGENT_TEMPDIRECTORY/terraform-bin"
      echo "##vso[task.prependpath]$AGENT_TEMPDIRECTORY/terraform-bin"
    displayName: Install checksum-verified Terraform
  - bash: python3 -m unittest discover -s tests -v
    displayName: Test script safety and saved-plan contract
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory tests/fixtures/mock-module --test-directory tests
    displayName: Validate and test mock Terraform fixture
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory initial-setup/azure/backend --test-directory tests
    displayName: Validate and mock-test backend bootstrap
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory starter-templates/azure --test-directory tests
    displayName: Validate and mock-test Azure starter
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory initial-setup/azure/delivery-identities --test-directory tests
    displayName: Validate and mock-test CI identities
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory initial-setup/azure/azure-devops-connections --test-directory tests
    displayName: Validate and mock-test Azure DevOps connections
  - bash: python3 scripts/validate.py --source-root "$BUILD_SOURCESDIRECTORY" --directory examples/azure/three-tier/workload-vault --test-directory tests
    displayName: Validate and mock-test private workload vault

parameters:
- name: environment
  type: string
- name: locations
  type: object
  default:
  - uks
- name: repositoryName
  type: string
  default: $(Build.Repository.Name)
- name: configuration
  type: string
  default: delivery.azure.json
- name: prefix
  type: string
  default: ''
- name: planServiceConnection
  type: string
- name: applyServiceConnection
  type: string
  default: ''
- name: backendServiceConnection
  type: string
- name: variableGroup
  type: string
  default: ''
- name: deploymentBranch
  type: string
  default: main
- name: selfHostedAgentPool
  type: string
  default: terraform-trusted
- name: useHostedAgents
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: ubuntu-24.04
- name: enableApply
  type: boolean
  default: false
- name: whitelistRunnerIp
  type: boolean
  default: false
- name: keyVault
  type: string
  default: ''
- name: enableSecurityScans
  type: boolean
  default: false
- name: enforceSecurityScans
  type: boolean
  default: false
stages:
- stage: Guard_${{ replace(parameters.environment, '-', '_') }}
  displayName: Private project and branch guard
  jobs:
  - job: Guard
    pool:
      vmImage: ubuntu-24.04
    steps:
    - checkout: deliveryTemplates
      path: s/delivery-templates
      persistCredentials: false
    - bash: python3 "$(Pipeline.Workspace)/s/delivery-templates/scripts/ci_guard.py" azure-devops
      displayName: Reject public projects, pull requests and untrusted branches
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        DEPLOYMENT_BRANCH: ${{ parameters.deploymentBranch }}
- ${{ each region in parameters.locations }}:
  - template: terraform-deployment-stages.yml
    parameters:
      environment: ${{ parameters.environment }}
      repositoryName: ${{ parameters.repositoryName }}
      configuration: ${{ parameters.configuration }}
      prefix: ${{ parameters.prefix }}
      planServiceConnection: ${{ parameters.planServiceConnection }}
      applyServiceConnection: ${{ parameters.applyServiceConnection }}
      backendServiceConnection: ${{ parameters.backendServiceConnection }}
      variableGroup: ${{ parameters.variableGroup }}
      deploymentBranch: ${{ parameters.deploymentBranch }}
      selfHostedAgentPool: ${{ parameters.selfHostedAgentPool }}
      useHostedAgents: ${{ parameters.useHostedAgents }}
      hostedVmImage: ${{ parameters.hostedVmImage }}
      enableApply: ${{ parameters.enableApply }}
      whitelistRunnerIp: ${{ parameters.whitelistRunnerIp }}
      keyVault: ${{ parameters.keyVault }}
      enableSecurityScans: ${{ parameters.enableSecurityScans }}
      enforceSecurityScans: ${{ parameters.enforceSecurityScans }}
      region: ${{ region }}
      guardStage: Guard_${{ replace(parameters.environment, '-', '_') }}
